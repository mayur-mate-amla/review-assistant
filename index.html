<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Review Queue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231d5fd1%27/%3E%3Cpath d=%27m19 21 5-5-5-5M13 11l-5 5 5 5%27 stroke=%27white%27 stroke-width=%272.5%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f8fb;--surface:#fff;--surface-2:#f2f5fa;--line:#e5e9f1;--line-2:#d5dbe7;--fg:#101828;--fg-2:#344054;--muted:#667085;--accent:#1d5fd1;--accent-fg:#fff;--accent-soft:#e8f0fe;--ok:#067647;--ok-soft:#dcfae6;--warn:#b54708;--warn-soft:#fef0c7;--bad:#d92d20;--bad-soft:#fee4e2;--info:#475467;--info-soft:#eef1f6;--violet:#5b45d6;--violet-soft:#ece9fe;--shadow:0 1px 2px rgba(16,24,40,.05);--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace;--side:224px;--panel:500px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d121b;--surface:#151c29;--surface-2:#1b2434;--line:#263043;--line-2:#34415a;--fg:#e8edf6;--fg-2:#c3cbda;--muted:#93a0b8;--accent:#6ea0f5;--accent-fg:#0b1220;--accent-soft:#1a2c4d;--ok:#5ed39a;--ok-soft:#13362a;--warn:#f0c15e;--warn-soft:#3b2f12;--bad:#ff8a80;--bad-soft:#40201f;--info:#aab6cc;--info-soft:#232d40;--violet:#a99bff;--violet-soft:#2a2650;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d121b;--surface:#151c29;--surface-2:#1b2434;--line:#263043;--line-2:#34415a;--fg:#e8edf6;--fg-2:#c3cbda;--muted:#93a0b8;--accent:#6ea0f5;--accent-fg:#0b1220;--accent-soft:#1a2c4d;--ok:#5ed39a;--ok-soft:#13362a;--warn:#f0c15e;--warn-soft:#3b2f12;--bad:#ff8a80;--bad-soft:#40201f;--info:#aab6cc;--info-soft:#232d40;--violet:#a99bff;--violet-soft:#2a2650;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px}.ic.lg{width:22px;height:22px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;font-size:17px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--fg-2);font-weight:500;text-decoration:none}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto;background:var(--info-soft);color:var(--info);border-radius:999px;font-size:12px;font-weight:600;padding:0 8px;min-width:24px;text-align:center}
.nav a[aria-current="page"] .badge{background:var(--surface);color:var(--accent)}
.grow{flex:1}
.usercard{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);margin:0 -12px -16px;padding:14px 20px;width:calc(100% + 24px)}
.usercard:hover{background:var(--surface-2);text-decoration:none}
.usercard b{display:block;font-size:14px}.usercard span{color:var(--muted);font-size:12px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--accent-soft);color:var(--accent)}
.av.lg{width:40px;height:40px;font-size:14px;background:var(--accent);color:var(--accent-fg)}
.av.c1{background:#e0ecff;color:#1d4ed8}.av.c2{background:#fde7f3;color:#be185d}.av.c3{background:#dcfae6;color:#067647}.av.c4{background:#fef0c7;color:#b54708}.av.c5{background:#ece9fe;color:#5b45d6}
.main{padding:18px 24px 20px;min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#v-list{flex:1;min-height:0;display:flex;flex-direction:column}
#v-settings{flex:1;min-height:0;overflow:auto}
.stats,.filters,.top,.notice{flex:none}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.top h1{margin:0;font-size:26px;line-height:1.2;letter-spacing:-.01em}.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}.tools>*{flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:40px;color:var(--muted);box-shadow:var(--shadow)}
.search input{border:0;background:none;outline:0;min-width:0;flex:1;height:100%;color:var(--fg)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.top .search{width:360px}
kbd{font:600 11px var(--mono);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ok{color:var(--ok);border-color:var(--ok)}.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}.btn.ghost{border-color:transparent;background:none;box-shadow:none}
.btn.icon{width:36px;padding:0;justify-content:center}.btn.icon.sm{width:30px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:4px 12px}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor}
.live.sync{color:var(--warn);background:var(--warn-soft)}.live.off{color:var(--bad);background:var(--bad-soft)}
.menu{position:absolute;z-index:30;right:0;top:calc(100% + 6px);min-width:220px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 12px 32px rgba(16,24,40,.18);padding:6px}
.menu button,.menu label{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:7px;text-align:left;font-weight:500;cursor:pointer}
.menu button:hover:not(:disabled),.menu label:hover{background:var(--surface-2)}.menu button:disabled{opacity:.45;cursor:not-allowed}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.rel{position:relative}
.notice{margin-bottom:12px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.notice.bad{background:var(--bad-soft);color:var(--bad)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.stat{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--line-2)}.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tile{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.tile.red{background:var(--bad-soft);color:var(--bad)}.tile.blue{background:var(--accent-soft);color:var(--accent)}.tile.green{background:var(--ok-soft);color:var(--ok)}.tile.gray{background:var(--info-soft);color:var(--info)}
.stat b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:14px}

/* filters */
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters .search{width:240px;height:38px}
.sel{position:relative;display:inline-block}.sel select{appearance:none;-webkit-appearance:none;height:38px;padding:0 34px 0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;box-shadow:var(--shadow);max-width:180px}
.sel select.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.sel .ic{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);width:14px;height:14px}
.sortbox{margin-left:auto;display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);height:38px}
.sortbox>span:first-child{padding:0 10px 0 14px;color:var(--muted);font-size:13px}.sortbox select{border:0;box-shadow:none;border-left:1px solid var(--line);border-radius:0 10px 10px 0;height:36px}
.clear{color:var(--accent);background:none;border:0;display:inline-flex;align-items:center;gap:6px;font-weight:500;padding:6px}

/* list + panel */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:stretch;flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
.split.open{grid-template-columns:minmax(0,1fr)}
.split.open .listbox{display:none}
.listbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;box-shadow:var(--shadow);min-height:0}
.listbox{scroll-padding-top:48px}
.listbox thead th{position:sticky;top:0;background:var(--surface);z-index:2}
.bulk{position:sticky;top:0;z-index:3}
.bulk{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--accent-soft);color:var(--accent);font-weight:600;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
th{font-size:13px;font-weight:600;color:var(--fg-2);text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;position:relative}
tbody tr:hover{background:var(--surface-2)}
tbody tr.active{background:var(--accent-soft)}
tbody tr.active td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tbody tr:last-child td{border-bottom:0}
.cb{width:16px;height:16px;accent-color:var(--accent);margin:0}
td.ck,th.ck{width:40px;padding-right:0}
td.tt{min-width:190px}
.split.open .rn{display:none}
.acts{display:flex;gap:8px;justify-content:flex-end;white-space:nowrap}th.col-act{text-align:right}
.split.open .col-wait{display:none}.split.open .meta{display:flex}.split.open .meta .chip{display:none}
.key{font-weight:700;color:var(--accent);font-size:14px}
.ttl{color:var(--fg);max-width:44ch;margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.repos{display:flex;gap:6px;flex-wrap:wrap}
.repo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-2);white-space:nowrap}
.repo.pill{border:1px solid var(--line);border-radius:7px;padding:2px 7px;background:var(--surface)}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--info-soft);color:var(--info)}
.chip.red{background:var(--bad-soft);color:var(--bad)}.chip.blue{background:var(--accent-soft);color:var(--accent)}.chip.green{background:var(--ok-soft);color:var(--ok)}.chip.amber{background:var(--warn-soft);color:var(--warn)}.chip.violet{background:var(--violet-soft);color:var(--violet)}
.chip.round{border-radius:999px;padding:1px 8px}
.mini{display:block;font-size:12px;color:var(--muted);margin-top:3px}.mini.g{color:var(--ok)}.mini.r{color:var(--bad)}
.wait{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--fg-2)}.wait.late{color:var(--bad)}
.cmt{display:inline-flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.meta{display:none;margin-top:4px;gap:8px;align-items:center;flex-wrap:wrap}
.listbox{display:flex;flex-direction:column}.listbox table{flex:none}
.foot{margin-top:auto;position:sticky;bottom:0;background:var(--surface);padding:12px 18px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:0;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.ph{padding:16px 18px 0}
.pk{display:flex;align-items:center;gap:8px}.pk .k{font-size:20px;font-weight:700;color:var(--accent)}
.pk .sp{flex:1}
.ph h2{font-size:18px;line-height:1.3;margin:10px 0 4px}
.desc{color:var(--muted);margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;margin-bottom:10px}.tag{flex:none}
.tag{border:1px solid var(--line);border-radius:7px;padding:2px 9px;font-size:12.5px;color:var(--fg-2);background:var(--surface-2)}
.byline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;flex-wrap:wrap;margin-bottom:12px}.byline b{color:var(--fg)}
.prsw{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.prsw button{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;font-weight:500}
.prsw button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.prsw a{font-size:12px;margin-left:2px}
.vd{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}.vd.bad{background:var(--bad)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px;font-weight:600;color:var(--fg-2);display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .n{background:var(--info-soft);color:var(--info);border-radius:999px;font-size:12px;padding:0 7px;font-weight:600}
.tabs button[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}
.pb{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.card h3 .r{margin-left:auto;font-size:12px;font-weight:600;white-space:nowrap}
.two .card{padding:12px 12px}.two .card h3{gap:6px;font-size:14px}
.card p{margin:0 0 6px}.card p:last-child{margin:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.banner{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner.run{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.banner.fail{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.sevrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;margin-bottom:6px;font-size:13px}
.sevrow .num{font-weight:700}.sevrow .nm{font-weight:600}.sevrow .cat{color:var(--fg-2);margin-left:auto;text-align:right;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sevrow.high{background:var(--bad-soft);color:var(--bad)}.sevrow.medium{background:var(--warn-soft);color:var(--warn)}.sevrow.low{background:var(--accent-soft);color:var(--accent)}
.good{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:600}
.chk{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13.5px}
.chk .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none;background:var(--muted)}
.dot.pass{background:var(--ok)}.dot.concern{background:#e9a216}.dot.fail{background:var(--bad)}.dot.na{background:var(--line-2)}
.pill{border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--info-soft);color:var(--info);white-space:nowrap}
.pill.pass{background:var(--ok-soft);color:var(--ok)}.pill.concern{background:var(--warn-soft);color:var(--warn)}.pill.fail{background:var(--bad-soft);color:var(--bad)}
.chk[title]{cursor:help}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px}
details.more summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details.more h4,.card h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
ul.plain{margin:0;padding-left:18px}ul.plain li{margin:3px 0}
.files{list-style:none;margin:0;padding:0}.files li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.files li:last-child{border:0}
.files .p{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere;flex:1}.files .st{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--info-soft);color:var(--info);flex:none}
.files .st.A{background:var(--ok-soft);color:var(--ok)}.files .st.D{background:var(--bad-soft);color:var(--bad)}.files .st.M{background:var(--warn-soft);color:var(--warn)}
.add{color:var(--ok);font-family:var(--mono)}.del{color:var(--bad);font-family:var(--mono)}
.fnd{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.fnd .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.loc{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.ev{display:block;font-family:var(--mono);font-size:12px;background:var(--surface-2);border-radius:6px;padding:5px 8px;margin:6px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.fix{color:var(--fg-2);font-size:13px}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.big div{border-radius:10px;padding:10px;text-align:center;background:var(--surface-2)}.big b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.big span{font-size:12px;color:var(--muted)}
.big .p b{color:var(--ok)}.big .f.bad b{color:var(--bad)}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.msg.mine{background:var(--accent-soft);border-color:transparent}.msg.fresh{border-color:var(--warn);background:var(--warn-soft)}
.msghead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}.msghead b{color:var(--fg)}
.msgbody{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px;font-size:13px}
.muted{color:var(--muted)}
.chip.off{opacity:.55}.chipx{border:0;background:none;color:inherit;padding:0;display:inline-grid;place-items:center;cursor:pointer}.chipx:hover{color:var(--bad)}
/* full-page detail */
.pk .btn{margin-right:4px}.ic.back{transform:rotate(180deg)}
.pscroll{flex:1;overflow:auto;background:var(--bg)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;padding:16px 18px 24px;align-items:start}
.pgmain{display:flex;flex-direction:column;gap:14px;min-width:0}
.pgside{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;min-width:0}
.pgside .pc{border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
h2.sec{margin:10px 0 0;font-size:16px;display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2.sec:first-child{margin-top:0}h2.sec .n{background:var(--info-soft);color:var(--info);border-radius:999px;font-size:12px;padding:0 8px;font-weight:600}
.ph h2{font-size:22px}.desc{-webkit-line-clamp:3}
.pvgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.pv h3{margin-bottom:10px}.pvbody{font-size:13px}
.pvbody.jira{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.md p{margin:0 0 8px}.md ul{margin:0 0 8px;padding-left:20px}.md li{margin:2px 0}.md h3.mdh,.md h4.mdh,.md h5.mdh,.md h6.mdh{margin:12px 0 6px;font-size:14px}.md h3.mdh{font-size:15px}
.md blockquote{margin:0 0 8px;padding:2px 10px;border-left:3px solid var(--line-2);color:var(--fg-2)}.md hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.md code.ic2{font-family:var(--mono);font-size:12px;background:var(--surface-2);border-radius:4px;padding:0 4px}
.mdtw{overflow-x:auto;margin-bottom:8px}.mdt{width:100%;border-collapse:collapse;font-size:12.5px}.mdt th,.mdt td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top;white-space:normal}.mdt th{background:var(--surface-2)}
@media (max-width:1280px){.pvgrid{grid-template-columns:minmax(0,1fr)}}

/* composer */
.pc{border-top:1px solid var(--line);padding:10px 18px 12px;background:var(--surface)}
.pc h3{margin:0 0 8px;font-size:15px}
.cmp{display:flex;gap:10px}
.cbox{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:10px;background:var(--surface)}
.cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cbox textarea{width:100%;border:0;outline:0;background:none;resize:none;min-height:40px;max-height:160px;padding:8px 12px;display:block}
.tb{display:flex;gap:2px;padding:4px 8px 6px}
.tb button{border:0;background:none;width:28px;height:28px;border-radius:6px;color:var(--muted);display:grid;place-items:center}.tb button:hover{background:var(--surface-2);color:var(--fg)}
.cact{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:10px}
.cact details{margin-right:auto;font-size:13px;color:var(--muted)}.cact details summary{cursor:pointer}
.cact details select{margin-top:6px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px}
.rto{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:13px}

/* settings */
.set{display:grid;gap:14px;max-width:760px}
.set .card h3{font-size:16px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.srow:last-child{border:0}.srow .l{flex:1}.srow .l span{display:block;color:var(--muted);font-size:13px}
.switch{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;border:0;margin:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.switch:checked{background:var(--accent)}.switch:checked::after{left:21px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}.seg button{border:0;background:var(--surface);padding:6px 14px;font-weight:600;color:var(--fg-2)}.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
dl.kv{margin:0;display:grid;grid-template-columns:150px 1fr;gap:8px 12px}dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;overflow-wrap:anywhere}

#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;cursor:pointer}.toast.bad{background:var(--bad);color:#fff}
#backdrop{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:40}

/* responsive */
@media (max-width:1500px){.split.open .col-from{display:none}.split.open .col-cmt{display:none}}
@media (max-width:1280px){.split.open .col-repo{display:none}.split.open .meta{display:flex}}
@media (max-width:1000px){.tools{flex-wrap:wrap}.top .search{width:100%}}

@media (max-width:1180px),(max-height:760px){
  .main{height:auto;min-height:100vh;overflow:visible}
  #v-list{display:block}.split{display:grid;grid-template-rows:none}
  .listbox{overflow-x:auto;overflow-y:visible}.listbox thead th{position:static}.foot{position:static}
  .panel{height:auto;overflow:visible}.pscroll{overflow:visible}
  .side{height:100vh}
}
@media (max-width:1180px){
  .pgrid{grid-template-columns:minmax(0,1fr)}.pgside{position:static;order:-1}
}
@media (max-width:860px){
  .side{height:100vh}
  :root{--side:64px}
  .side{padding:12px 8px}.brand span,.nav a span,.nav .badge,.usercard div,.usercard .ic{display:none}.brand{justify-content:center;padding-inline:0}.nav a{justify-content:center}
  .usercard{justify-content:center;padding:12px 0;margin:0 -8px -12px;width:calc(100% + 16px)}
  .main{padding:14px 14px 24px}.col-from,.col-wait{display:none}.meta{display:flex}
  .two{grid-template-columns:1fr}
}
@media (max-width:600px){
  .col-repo,.col-cmt,.col-st{display:none}td.tt{min-width:0}.meta .chip{display:inline-flex!important}.acts{flex-direction:column;gap:4px}.top h1{font-size:22px}.filters .search{width:100%}.sortbox{margin-left:0}.top .search{width:100%}
  .tools{width:100%}.panel{width:100%;border-radius:0}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:10px 12px;gap:10px}.tile{width:38px;height:38px}.stat b{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
"use strict";
var AREAS=["admin","api","webstore","db"],LABEL={admin:"Admin",api:"API",webstore:"Webstore",db:"DB"};
var CHECKS=[["requirements","Requirements","Requirements"],["correctness","Functional correctness","Correctness"],["edgeCases","Edge cases","Edge cases"],["security","Security","Security"],["errorHandling","Error handling & logging","Error handling"],["standards","Coding standards","Standards"],["architecture","Architecture alignment","Architecture"],["performance","Performance","Performance"],["breakingChanges","Breaking changes","Breaking changes"],["impact","Impact / regression scope","Impact"],["conversation","PR comments & discussion","PR comments"],["tests","Tests","Unit tests"],["maintainability","Maintainability","Maintainability"]];
var SEVRANK={blocker:5,high:4,medium:3,low:2,nit:1};
var STATUS_OPTS=[["","Status"],["needs","Needs review"],["progress","In progress"],["ready","Ready to post"],["posted","Posted"]];
var SORTS=[["wait","Oldest waiting"],["new","Newest first"],["sev","Highest severity"],["cmt","Most comments"],["key","Jira key"]];
var VIEWS={all:{t:"Code Review Queue",s:"Review, give feedback and help ship high quality code.",icon:"queue",name:"All Review"},settings:{t:"Settings",s:"Sync, appearance and review rules.",icon:"settings",name:"Settings"}};

var S=null,last="",view="all",sel=null,tab="overview",selPr={},checked={},drafts={},replyTo={},busy={},armed={},me="",loaded=false,offline=false;
var F={q:"",status:"",repo:"",from:"",sev:"",sort:"wait"};
var $=function(id){return document.getElementById(id)};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- dom helpers ---------- */
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ic(name,cls){var s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("class","ic"+(cls?" "+cls:""));s.setAttribute("aria-hidden","true");var u=document.createElementNS("http://www.w3.org/2000/svg","use");u.setAttribute("href","#i-"+name);s.appendChild(u);return s}
function add(p){for(var i=1;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;p.appendChild(typeof c==="string"?document.createTextNode(c):c)}return p}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);return n}
function safeUrl(u){return typeof u==="string"&&/^https:\/\//i.test(u)?u:null}
function ext(href,text,cls){var a=el("a",cls||"",text);var u=safeUrl(href);if(u){a.href=u;a.target="_blank";a.rel="noopener"}return a}
function api(path,body){return fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Review-Bot":"1"},body:JSON.stringify(body||{})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||r.status);return j})})}
function toast(msg,bad){var t=el("div","toast"+(bad?" bad":""),msg);t.addEventListener("click",function(){t.remove()});$("toasts").appendChild(t);if(!bad)setTimeout(function(){t.remove()},6500)}
function banner(msg,bad){var n=$("notice");n.textContent=msg||"";n.className="notice"+(bad?" bad":"");n.hidden=!msg}
function initials(n){var p=String(n||"?").trim().split(/\s+/);return ((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase()}
function avatar(n,big){var h=0,s=String(n||"");for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;var a=el("span","av c"+(1+Math.abs(h)%5)+(big?" lg":""),initials(n));a.setAttribute("aria-hidden","true");return a}
function when(s){try{return new Date(s).toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})}catch(e){return s||""}}
function ago(s){if(!s)return"";var ms=Date.now()-new Date(s).getTime();if(!(ms>=0))return"";var m=Math.floor(ms/60000),h=Math.floor(m/60),d=Math.floor(h/24);if(d>=1)return d+"d "+(h%24)+"h";if(h>=1)return h+"h"+(m%60?" "+(m%60)+"m":"");return Math.max(m,1)+"m"}
function upper1(s){s=String(s||"");return s.charAt(0).toUpperCase()+s.slice(1)}

/* ---------- ticket model ---------- */
function stCode(t){return (t.review&&t.review.state)||"none"}
function group(t){var s=stCode(t);return s==="running"?"progress":s==="draft"?"ready":s==="posted"?"posted":"needs"}
function chipFor(t){var s=stCode(t),p=t.review&&t.review.progress;
  return ({none:["red","Needs review"],failed:["red","Review failed"],stale:["amber","PR changed"],running:["blue","In progress"+(p?" · "+p:"")],draft:["green","Ready to post"],posted:["violet","Posted"]})[s]||["red","Needs review"]}
function prList(t){return AREAS.filter(function(a){return t.prs&&t.prs[a]&&t.prs[a].number}).map(function(a){return Object.assign({area:a},t.prs[a])})}
function hasPr(t){return AREAS.some(function(a){return t.prs&&t.prs[a]&&safeUrl(t.prs[a].url)})}
function perPr(t,a){return t.reviewData&&(t.reviewData.perPr||[]).filter(function(x){return x.area===a})[0]}
function allFindings(t){var o=[];if(t.reviewData)(t.reviewData.perPr||[]).forEach(function(p){(p.findings||[]).forEach(function(f){if(f.label!=="praise")o.push(f)})});return o}
function topSev(t){return allFindings(t).reduce(function(m,f){return Math.max(m,SEVRANK[String(f.severity).toLowerCase()]||0)},0)}
function sevGroup(f){var s=String(f.severity).toLowerCase();return s==="blocker"||s==="high"?"high":s==="medium"?"medium":"low"}
function commentCount(t){return AREAS.reduce(function(n,a){var th=t.threads&&t.threads[a];return n+(th?(th.total!=null?th.total:(th.items||[]).length):0)},0)}
function newReplies(t){return AREAS.reduce(function(n,a){return n+((t.threads&&t.threads[a]&&t.threads[a].newCount)||0)},0)}
function isMine(t){return !!t.reviewData||AREAS.some(function(a){return((t.threads&&t.threads[a]&&t.threads[a].items)||[]).some(function(i){return i.mine})})}
function postedToday(t){return t.posted&&t.posted.at&&new Date(t.posted.at).toDateString()===new Date().toDateString()}
function inView(){return true}
function waitMs(t){var d=t.waitingSince||t.updatedAt;return d?Date.now()-new Date(d).getTime():null}
function authorsOf(t){var seen={},o=[];prList(t).forEach(function(p){var n=p.authorName||p.author;if(n&&!seen[n]){seen[n]=1;o.push(n)}});return o}
/* "From" = who raised the PR (GitHub author); the Jira reporter is only a fallback */
function reporter(t){var a=authorsOf(t);return a[0]||(t.reporter&&t.reporter.name)||""}

function visible(){

function applyTheme(){var t=lsGet("rb.theme")||"system",r=document.documentElement;if(t==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t)}

/* ---------- top-level ---------- */
function renderChrome(){
  var V=VIEWS[view];$("h1").textContent=V.t;$("sub").textContent=V.s;document.title=V.t;
  var settings=view==="settings";$("v-list").hidden=settings;$("v-settings").hidden=!settings;
  var live=$("live");live.className="live"+(offline?" off":S&&S.syncing?" sync":"");live.lastChild.textContent=offline?"Offline":S&&S.syncing?"Syncing":"Live";
  var sy=!!(S&&S.syncing);$("refresh").disabled=sy;$("synctxt").textContent=sy?"Syncing…":"Sync";$("syncic").setAttribute("class","ic"+(sy?" spin":""));
  $("syncinfo").textContent=S&&S.lastSyncAt?"Last sync "+ago(S.lastSyncAt)+" ago":"Not synced yet";
  $("uname").textContent=me||"Reviewer";$("uav").textContent=initials(me||"Reviewer");
  if(S){if(S.syncError)banner("Sync failed: "+S.syncError,true);else if(!S.jiraConfigured)banner("Jira is not configured. Add JIRA_EMAIL and JIRA_API_TOKEN to .env, then restart the bot.",true);else if(offline)banner("Cannot reach the bot. Is it running?",true);else banner("")}}

  renderFilters();renderList();renderPanel()}

function load(force){return fetch("/api/state").then(function(r){return r.json()}).then(function(j){offline=false;var s=JSON.stringify(j),first=!loaded;loaded=true;if(!force&&s===last&&!first){renderChrome();return}S=j;last=s;renderAll()}).catch(function(){offline=true;if(S)renderChrome();else banner("Cannot reach the bot. Is it running?",true)})}
function doSync(){$("refresh").disabled=true;api("/api/sync").then(function(){return load(true)}).catch(function(e){toast("Could not start sync: "+e.message,true)})}

function setQ(v){F.q=v;saveF();if(S){renderFilters();renderList()}}

function typingNow(){var a=document.activeElement;return a&&(a.tagName==="INPUT"&&a.type!=="checkbox"||a.tagName==="TEXTAREA"||a.tagName==="SELECT")}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){var open=document.querySelector(".menu:not([hidden])");if(open){open.hidden=true;return}if(typingNow()){document.activeElement.blur();return}if(sel)go(view,null);return}
  if(typingNow()||e.ctrlKey||e.metaKey||e.altKey)return;

  if((e.key==="j"||e.key==="k")&&S&&view!=="settings"){var l=visible();if(!l.length)return;var i=l.findIndex(function(t){return t.key===sel});i=e.key==="j"?Math.min(l.length-1,i+1):Math.max(0,i<0?0:i-1);go(view,l[i].key);var r=document.querySelector('tr[data-key="'+l[i].key+'"]');if(r)r.scrollIntoView({block:"nearest"})}});
window.addEventListener("hashchange",function(){parseHash();renderAll()});

(function init(){

  applyTheme();parseHash();banner("");
  fetch("/api/me").then(function(r){return r.json()}).then(function(j){me=j.name||"";if(S)renderChrome()}).catch(function(){});
  load(true);setInterval(function(){load(false)},3000);
  setInterval(function(){if(S)renderChrome()},30000);
